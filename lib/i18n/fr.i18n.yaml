  ncLoginStep:
    whereToStoreData: "Choisissez où vous souhaitez stocker vos données :"
    saberNcServer: Le serveur Nextcloud de Saber
    otherNcServer: Autre serveur Nextcloud
    serverUrl: Adresse du serveur
    loginWithSaber: Se connecter avec Saber
    loginWithNextcloud: Se connecter avec Nextcloud
    loginFlow:
      pleaseAuthorize: Veuillez autoriser Saber pour accéder à votre compte Nextcloud
      followPrompts: Veuillez suivre les indications dans l'interface Nextcloud
      browserDidntOpen: La page de connexion n'est pas ouverte ? Cliquez ici
  encLoginStep:
    enterEncPassword: "Pour protéger vos données, saisissez votre mot de passe de chiffrement :"
    newToSaber: Nouveau sur Saber ? Entrez simplement un nouveau mot de passe de chiffrement.
    encPassword: Mot de passe de chiffrement
    encFaqTitle: Foire aux questions
    wrongEncPassword: Le décryptage a échoué avec le mot de passe fourni. Veuillez réessayer.
    connectionFailed: Quelque chose s'est mal connecté au serveur. Veuillez réessayer plus tard.
    encFaq:
    - q: Qu'est-ce qu'un mot de passe de chiffrement ? Pourquoi utiliser deux mots de passe ?
      a: |-
        Le mot de passe Nextcloud est utilisé pour accéder au cloud. Le mot de passe de chiffrement crypte vos données lors de la transmission au nuage.
        Même si quelqu'un accède à votre compte Nextcloud, vos notes demeureront en sécurité et cryptées avec un mot de passe séparé. Cela vous offre une deuxième couche de sécurité pour protéger vos données.
        Personne ne peut accéder à vos notes sur le serveur sans votre mot de passe de chiffrement, mais cela signifie aussi que si vous oubliez votre mot de passe de chiffrement, vous perdrez accès à vos données.
    - q: Je n'ai pas encore défini de mot de passe de chiffrement. Où est-ce qu'il se trouve ?
      a: |-
        Choisissez un nouveau mot de passe de chiffrement et entrez-le ci-dessus.
        Saber va générer vos clés de chiffrement à partir de ce mot de passe automatiquement.
    - q: Puis-je utiliser le même mot de passe que mon compte Nextcloud ?
      a: Oui, mais gardez à l'esprit qu'il serait plus facile pour l'administrateur du serveur ou quelqu'un d'autre d'accéder à vos notes s'ils accèdent à votre compte Nextcloud.
profile:
  title: Mon profil
  logout: Déconnexion
  quotaUsage: Vous utilisez $used sur $total ($percent%)
  connectedTo: Connecté à
  quickLinks:
    serverHomepage: Page d'accueil du serveur
    deleteAccount: Supprimer le compte
  faqTitle: Foire aux questions
  faq:
  - q: Vais-je perdre mes notes si je me déconnecte ?
    a: Non. Vos notes seront conservées à la fois sur votre poste et sur le serveur. Elles ne seront pas synchronisées avec le serveur jusqu'à votre prochaine connexion. Assurez-vous que la synchronisation soit terminée avant de vous déconnecter pour ne perdre aucune donnée (consultez la barre de progression sur l'écran d'accueil).
  - q: Comment changer mon mot de passe Nextcloud ?
    a: Allez sur le site web du serveur et connectez-vous. Allez dans Paramètres > Sécurité > Changer mon mot de passe. Vous devrez vous déconnecter et vous reconnecter dans Saber après avoir changé votre mot de passe.
  - q: Comment changer mon mot de passe de chiffrement ?
    a: |-
      0. Assurez-vous que la synchronisation soit terminée (regardez la barre de progression sur l'écran d'accueil).
      1. Déconnectez-vous de Saber.
      2. Sur le site web du serveur supprimez votre dossier 'Saber'. Cela supprimera toutes vos notes sur le serveur.
      3. Connectez-vous à nouveau dans Saber. Vous pourrez choisir un nouveau mot de passe de chiffrement à la connexion.
      4. N'oubliez pas de vous déconnecter et vous re-connecter dans Saber sur votre poste également.
  - q: Comment puis-je supprimer mon compte ?
    a: |-
      Cliquez sur le button "@:profile.quickLinks.deleteAccount" ci-dessus, et connectez-vous si nécessaire.
      Si vous utilisez le serveur Saber officiel, votre compte sera supprimé au bout d'une semaine . Durant cette période, vous pourrez me contacter à adilhanney@disroot.org pour annuler la suppression.
      Si vous utilisez un autre serveur, il n'est pas certain que vous puissiez supprimer votre compte dessus : il vous faudra consulter les règles de confidentialité du serveur pour plus d'informations.
  quotaUsageUncapped(OUTDATED): Vous utilisez $used
