  ncLoginStep:
    whereToStoreData: "Pilih tempat menyimpan datamu:"
    saberNcServer: Server Nextcloud milik Saber
    otherNcServer: Server Nextcloud lain
    serverUrl: URL server
    loginWithSaber: Masuk dengan Saber
    loginWithNextcloud: Masuk dengan Nextcloud
    loginFlow:
      pleaseAuthorize: Izinkan Saber mengakses akun Nextcloud-mu
      followPrompts: Ikuti petunjuk yang muncul di antarmuka Nextcloud
      browserDidntOpen: Halaman masuk tidak terbuka? Klik di sini
  encLoginStep:
    enterEncPassword: "Untuk melindungi datamu, masukkan kata sandi enkripsi:"
    newToSaber: Baru di Saber? Cukup masukkan kata sandi enkripsi baru.
    encPassword: Kata sandi enkripsi
    encFaqTitle: Pertanyaan yang sering diajukan
    wrongEncPassword: Dekripsi gagal dengan kata sandi tersebut. Coba masukkan lagi.
    connectionFailed: Terjadi masalah saat menghubungkan ke server. Coba lagi nanti.
    encFaq:
    - q: Apa itu kata sandi enkripsi? Kenapa harus pakai dua kata sandi?
      a: |-
        Kata sandi Nextcloud dipakai untuk mengakses cloud. Kata sandi enkripsi "mengacak" datamu sebelum sampai ke cloud.
        Bahkan kalau ada yang berhasil masuk ke akun Nextcloud-mu, catatanmu tetap aman karena dienkripsi dengan kata sandi yang terpisah. Ini memberimu lapisan keamanan kedua untuk melindungi datamu.
        Tidak ada yang bisa mengakses catatanmu di server tanpa kata sandi enkripsi, tetapi ini juga berarti kalau kamu lupa kata sandi enkripsi, kamu akan kehilangan akses ke datamu.
    - q: Saya belum mengatur kata sandi enkripsi. Dari mana saya mendapatkannya?
      a: |-
        Pilih kata sandi enkripsi baru, lalu masukkan di atas.
        Saber akan membuat kunci enkripsimu secara otomatis dari kata sandi tersebut.
    - q: Bolehkah memakai kata sandi yang sama dengan akun Nextcloud saya?
      a: Boleh, tetapi ingat bahwa administrator server atau orang lain akan lebih mudah mengakses catatanmu kalau mereka berhasil masuk ke akun Nextcloud-mu.
profile:
  title: Profil saya
  logout: Keluar
  quotaUsage: Kamu memakai $used dari $total ($percent%)
  quotaUsageUncapped: Kamu memakai $used
  connectedTo: Terhubung ke
  quickLinks:
    serverHomepage: Beranda server
    deleteAccount: Hapus akun
  faqTitle: Pertanyaan yang sering diajukan
  faq:
  - q: Apakah catatan saya akan hilang kalau saya keluar?
    a: Tidak. Catatanmu tetap ada di perangkat maupun di server. Catatan tidak akan disinkronkan dengan server sampai kamu masuk lagi. Pastikan sinkronisasi sudah selesai sebelum keluar supaya tidak ada data yang hilang (lihat progres sinkronisasi di layar beranda).
  - q: Bagaimana cara mengganti kata sandi Nextcloud?
    a: Buka situs web server dan masuk. Lalu buka Pengaturan > Keamanan > Ubah kata sandi. Setelah mengganti kata sandi, kamu perlu keluar lalu masuk kembali ke Saber.
  - q: Bagaimana cara mengganti kata sandi enkripsi?
    a: |-
      0. Pastikan sinkronisasi sudah selesai (lihat progres sinkronisasi di layar beranda).
      1. Keluar dari Saber.
      2. Buka situs web server dan hapus folder 'Saber'. Ini akan menghapus semua catatanmu dari server.
      3. Masuk lagi ke Saber. Kamu bisa memilih kata sandi enkripsi baru saat masuk.
      4. Jangan lupa keluar dan masuk lagi ke Saber di perangkat lainmu juga.
  - q: Bagaimana cara menghapus akun saya?
    a: |-
      Ketuk tombol "@:profile.quickLinks.deleteAccount" di atas, lalu masuk jika diminta.
      Jika kamu memakai server resmi Saber, akunmu akan dihapus setelah masa tenggang 1 minggu. Selama masa ini, kamu bisa menghubungi saya di adilhanney@disroot.org untuk membatalkan penghapusan.
      Jika kamu memakai server pihak ketiga, mungkin tidak ada opsi untuk menghapus akun: kamu perlu membaca kebijakan privasi server tersebut untuk informasi lebih lanjut.
