login:
  form:
    agreeToPrivacyPolicy(rich,OUTDATED): 로그인함으로써 귀하는 ${linkToPrivacyPolicy(개인정보 처리방침)}에 동의합니다.
  status:
    loggedOut(OUTDATED): 로그아웃됨
    tapToLogin(OUTDATED): Nextcloud로 로그인하려면 탭하세요
    hi(OUTDATED): 안녕하세요, $u!
    almostDone(OUTDATED): 동기화 준비가 거의 완료되었습니다. 로그인하려면 탭하세요.
    loggedIn(OUTDATED): Nextcloud로 로그인했습니다
  ncLoginStep:
    loginFlow:
      pleaseAuthorize(OUTDATED): Saber에게 귀하의 Nextcloud 계정에 액세스할 수 있는 권한을 부여해 주세요.
      followPrompts(OUTDATED): Nextcloud 인터페이스의 프롬프트를 따르세요
      browserDidntOpen(OUTDATED): 로그인 페이지가 열리지 않았나요? 여기를 클릭하세요
    whereToStoreData(OUTDATED): "데이터를 어디에 저장할지 선택하세요:"
    saberNcServer(OUTDATED): Saber의 Nextcloud 서버
    otherNcServer(OUTDATED): 다른 Nextcloud 서버
    serverUrl(OUTDATED): 서버 URL
    loginWithSaber(OUTDATED): Saber로 로그인하기
    loginWithNextcloud(OUTDATED): Nextcloud로 로그인하기
  encLoginStep:
    encFaq:
    - q(OUTDATED): 암호화 비밀번호란 무엇인가요? 왜 두 개의 비밀번호를 사용해야 하나요?
      a(OUTDATED): |-
        Nextcloud 비밀번호는 클라우드에 접속하는 데 사용됩니다. 암호화 비밀번호는 데이터가 클라우드에 도달하기 전에 데이터를 "난독화"합니다.
        누군가가 Nextcloud 계정에 접근하더라도 별도의 비밀번호로 메모가 안전하게 암호화되어 보호됩니다. 이는 데이터를 보호하기 위한 두 번째 보안 계층을 제공합니다.
        암호화 비밀번호 없이는 서버에서 누구도 귀하의 메모에 접근할 수 없지만, 이는 또한 암호화 비밀번호를 잊어버리면 데이터에 액세스할 수 없다는 것을 의미합니다.
    - q(OUTDATED): 아직 암호화 비밀번호를 설정하지 않았습니다. 어디서 받을 수 있나요?
      a(OUTDATED): |-
        새로운 암호화 비밀번호를 선택하고 위에 입력하세요.
        Saber가 이 비밀번호로부터 암호화 키를 자동으로 생성할 것입니다.
    - q(OUTDATED): Nextcloud 계정과 동일한 비밀번호를 사용할 수 있나요?
      a(OUTDATED): 네, 하지만 서버 관리자나 다른 사람이 귀하의 Nextcloud 계정에 접근할 경우 귀하의 메모에 접근하기가 더 쉬울 수 있다는 점을 염두에 두시기 바랍니다.
    enterEncPassword(OUTDATED): "데이터를 보호하려면 암호화 비밀번호를 입력하십시오:"
    newToSaber(OUTDATED): Saber를 처음 사용하시나요? 새 암호만 입력하세요.
    encPassword(OUTDATED): 암호화 비밀번호
    encFaqTitle(OUTDATED): 자주 묻는 질문
    wrongEncPassword(OUTDATED): 제공된 비밀번호로 복호화에 실패했습니다. 다시 입력해 주세요.
    connectionFailed(OUTDATED): 서버에 연결하는 중 문제가 발생했습니다. 나중에 다시 시도해 주세요.
  title(OUTDATED): 로그인
  signup(rich,OUTDATED): 아직 계정이 없으신가요? ${linkToSignup(지금 가입하세요)}!
  notYou(rich,OUTDATED): 당신이 아니라고요? ${undoLogin(다른 계정 선택)}
profile:
  quickLinks:
    serverHomepage(OUTDATED): 서버 홈페이지
    deleteAccount(OUTDATED): 계정 삭제
  faq:
  - q(OUTDATED): 로그아웃하면 메모가 사라지나요?
    a(OUTDATED): 아니요. 메모는 기기와 서버 양쪽에 그대로 유지됩니다. 다시 로그인할 때까지 서버와 동기화되지 않습니다. 데이터 손실을 방지하려면 로그아웃하기 전에 동기화가 완료되었는지 확인하세요(홈 화면에서 동기화 진행 상황 확인).
  - q(OUTDATED): Nextcloud 비밀번호를 어떻게 변경하나요?
    a(OUTDATED): 서버 웹사이트로 이동하여 로그인하세요. 그런 다음 설정(Settings) > 보안(Security) > 비밀번호 변경(Change password)으로 이동합니다. 비밀번호를 변경한 후 Saber에서 로그아웃했다가 다시 로그인해야 합니다.
  - q(OUTDATED): 암호화 비밀번호를 변경하려면 어떻게 해야 하나요?
    a(OUTDATED): |-
      0. 동기화가 완료되었는지 확인하세요 (홈 화면에서 동기화 진행 상황을 확인하세요).
      1. Saber에서 로그아웃합니다.
      2. 서버 웹사이트로 이동하여 'Saber' 폴더를 삭제합니다. 이렇게 하면 서버의 모든 메모가 삭제됩니다.
      3. Saber에 다시 로그인합니다. 로그인할 때 새 암호화를 선택할 수 있습니다.
      4. 다른 기기에서도 Saber에서 로그아웃했다가 다시 로그인하는 것을 잊지 마세요.
  - q(OUTDATED): 계정을 삭제하려면 어떻게 해야 하나요?
    a(OUTDATED): |-
      위의 "@:profile.quickLinks.deleteAccount" 버튼을 탭하고 필요한 경우 로그인하세요.
      공식 Saber 서버를 사용 중인 경우, 1주일의 유예 기간이 지난 후 계정이 삭제됩니다. 이 기간 동안 adilhanney@disroot.org로 연락하여 삭제를 취소할 수 있습니다.
      제3자 서버를 사용하는 경우 계정을 삭제하는 옵션이 없을 수도 있습니다. 자세한 내용은 해당 서버의 개인정보 처리방침을 참조해야 합니다.
