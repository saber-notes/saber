  encLoginStep:
    encFaq:
    - q(OUTDATED): Zer da szyfratzeko adierazpenak? Nirein zeharketa bi adierazpenak erabiltzen?
      a(OUTDATED): |-
        Nextcloud-ko adierazpenak nubesik sartzeko erabiltzen da. Adierazpenaren adierazpenak zure datuak nubesera iritsi aurretik "zuztatu" ditu.
        Neketak Nextcloud-ko kontura sartzea lortzen badira, zure notaak erabili duen adierazpen berezia baten laguntzan seguru eta adierazpina mantentuko dira. Horrek datuak babesteko segurtasun zuzen bat ematen utzi zait.
        Neketak serverrean nahako ez du aukera zure adierazpenaren adierazpena gabe, baina horrek bermatzeko dizki adierazpenaren adierazpena ahaztu gero, datuei sartzeago.
    - q(OUTDATED): Eskriptatze lehenago ez dut ezartu. Non hartzen dezuke?
      a(OUTDATED): |-
        Zerbitzari berri bat aukeratu eta sartzen ditu gainean.
        Saber-ek sortuko dira zure kriptografiaren gakoak honeetik automatikoki.
    - q(OUTDATED): Ahal dezake nire Nextcloud kontua berriaren azpitatzaile bera erabiltzen?
      a(OUTDATED): Bai, baina saioa administrazioari edo beste norbait eragiarriago izango dela kontuan hartu, ez duela zure Nextcloud kontura eskaera lortzen.
    enterEncPassword(OUTDATED): "Datu ez daitez babesteko, mesedez sartu zure szyfratze-lehenizko lehensa:"
    newToSaber(OUTDATED): Saber-an berri zara? Saiatu szyfratze pasahit berria.
    encPassword(OUTDATED): Sifraz kriptografikoa
    encFaqTitle(OUTDATED): Auztatu behartzen dituzten galdetak
    wrongEncPassword(OUTDATED): Dekriptazioa ebaldi ez zen eskaintzen pasahitza. Mesedez, berriro saiatu sartzen.
    connectionFailed(OUTDATED): Sobertzen lagundu nahi du serverare konektatzeari. Mesedez, berriro entzun gero.
