profile:
  quickLinks:
    serverHomepage(OUTDATED): Zerbitzuen orrialdeak
    deleteAccount(OUTDATED): Kontua ez du.
  faq:
  - q(OUTDATED): Galdera nahikoak gordeko dira iragertzen badira?
    a(OUTDATED): Ez ez da. Sustraietak zure gailuan eta serbikarrean mantentuko dira. Serberare sinkronizatuko dira berriro sartzen utziko arte. Aseguruatu sinkronizazioa uko egin dela antesala sartzen aurteko, ez duzu datozen datu hutsik (aurreko ekranan sinkronizazio-progresua ikusi).
  - q(OUTDATED): Nola alda dezaket nire Nextcloud pasahitza?
    a(OUTDATED): Jo zure serbideraren gertubiko webgunean eta sartu. Bitarik, Azingerak pasahitza aldatuzko ondoren, sartzen eta berriro sartzea behar du.
  - q(OUTDATED): Nola aldatzen dezaket nire szyfruaren adierazpenpasswarten?
    a(OUTDATED): |-
      0. Aurrekoak sinkronizatuta dagoela ziurtatu (aurrekoak sinkronizazio-progresua etorrizko aurrekoan ikusi).
      1. Saber-etik irten.
      2. Goian duzun serveraren webgunean joan eta 'Saber' gehiago ez. Horrek serverareko zure nota guztiak ez ditu.
      3. Berriro itzuli Saber-era. Itzulera sartzen zutegun bitartean enkripzio-leheniz berria aukeratu huts.
      4. Beste gailuetan ere, irten eta berriro itzultzea ez ahaztu.
  - q(OUTDATED): Nola esan dezaket kontua ez?
    a(OUTDATED): |-
      Ir agertzen duen "@:profile.quickLinks.deleteAccount" botoia aprezatu eta behar baduzu, sartu.
      Saber serbizar ofiziala erabiltzen ari zaren kasuan, kontua unegatze-periobe bat (1 aste) pasatiz ezera da itxiko. Hala esateko, adilhanney@disroot.org berrera kontaktatu dezakezu ez denbora horretan ezabaketa huts egiteko.
      Zerrenda bateko serbizar erabiltzen ari zaren kasuan, kontua ezabatzeko aukera ez zaitezke aurkitzea: informazio gehiago eskatzeko serbizarren gizurtasun politikari joratu behar duzu.
