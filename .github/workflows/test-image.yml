name: Build test environment OCI image

on:
  schedule:
    - cron: '17 1 * * 3'
  push:
    tags:
      - "**"
    branches:
      - main
    paths:
      - .github/docker/Dockerfile
      - .github/workflows/test-image.yml
      - lib/data/version.dart
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Get Saber version
        id: version
        run: |
          buildName=$(grep -oP "(?<=buildName = ').*(?=')" lib/data/version.dart)
          echo "buildName=$buildName" >> $GITHUB_OUTPUT

      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/saber_test_env
          tags: |
            type=raw,value=latest
            type=raw,value=${{ steps.version.outputs.buildName }}
            type=raw,value={{date 'YYYYMMDD'}}

      - uses: docker/build-push-action@v6
        with:
          context: .github/docker
          platforms: linux/amd64,linux/arm64
          pull: true
          push: true
          no-cache: ${{ startsWith(github.ref, 'refs/tags/') }}
          tags: ${{ steps.meta.outputs.tags }}
