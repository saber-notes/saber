name: Build unofficial snap

on:
  workflow_dispatch:
  push:
    tags:
      - "**"
    branches:
      - "**"
    paths:
      - .github/workflows/snap.yml
      - snap/snapcraft.yaml

jobs:
  build-snap:
    strategy:
      fail-fast: false
      matrix:
        arch:
          - runs-on: ubuntu-latest
          - runs-on: ubuntu-24.04-arm
    runs-on: ${{ matrix.arch.runs-on }}
    timeout-minutes: 59
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Patch snapcraft.yaml to use current commit (github.sha)
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        run: |
          sed -i "s|source-tag: 'v.*'|source-commit: '${{ github.sha }}'|g" snap/snapcraft.yaml

      - name: Build snap
        id: build
        uses: snapcore/action-build@v1

      - name: Upload snap artifact
        uses: actions/upload-artifact@v7
        with:
          name: Saber-Snap
          path: ${{ steps.build.outputs.snap }}

      - name: Publish to Snap Store
        uses: snapcore/action-publish@v1
        env:
          SNAPCRAFT_STORE_CREDENTIALS: ${{ secrets.SNAPCRAFT_STORE_CREDENTIALS }}
        if: ${{ env.SNAPCRAFT_STORE_CREDENTIALS != '' }}
        with:
          snap: ${{ steps.build.outputs.snap }}
          release: ${{ startsWith(github.ref, 'refs/tags/') && 'stable' || 'edge' }}
